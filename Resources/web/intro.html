<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeskPet Intro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
// Login intro of DeskPet: a gold progress bar where the password field of the login or lock screen was →
// white-and-gold sanctum. mode=return: after an unlock (restoring the session) rather than after a system start.
// The system information comes from the native shell as URL parameters; a browser preview uses neutral defaults.
const Q = new URLSearchParams(location.search);
const INFO = {
  name: Q.get('name') || 'Friend',
  os: Q.get('os') || 'macOS',
  host: Q.get('host') || 'Mac',
  chip: Q.get('chip') || 'Apple Silicon',
  mem: Q.get('mem') || '— GB',
  darwin: Q.get('darwin') || '—',
  displays: Q.get('displays') || '1',
  user: Q.get('user') || 'user',
  greeting: Q.get('greeting') || 'Welcome back',
  ai: Q.get('ai') || 'DeskPet',              // the pet's name as shown
  aiLatin: Q.get('aiLatin') || 'DESKPET',    // the same in Latin capitals, for the large title
  memories: Q.get('memories'),               // optional live details for the boot log
  reminders: Q.get('reminders'),
  claude: Q.get('claude'),
  model: Q.get('model'),
};
const LOOP = Q.has('loop');
const RETURN = Q.get('mode') === 'return';
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.boot;
const post = m => { if (native) native.postMessage(m); };

// 时间轴（秒）：进度条 T_BAR，白金圣域 T_HOLY
const T_BAR = 1.9, T_HOLY = 3.9;
const T1 = T_BAR, T_END = T1 + T_HOLY;
const T_DONE = T_END - 0.6; // 通知播放器开始 0.6 s 淡出

const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
const SERIF = 'Didot, "Bodoni 72", "Times New Roman", serif';
const CJK = '"PingFang SC", "Hiragino Sans GB", sans-serif';

const cv = document.getElementById('cv'), x = cv.getContext('2d');
// 虚拟坐标系：高度固定 900，宽度随屏幕比例变化
let VW, VH = 900, CX, CY, S, DPR;
let U = 1;  // 每点（pt）对应的虚拟单位
function resize() {
  const w = innerWidth, h = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 3840 / w);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  S = h / VH; VW = w / S; CX = VW / 2; CY = VH / 2; U = VH / h;
}
addEventListener('resize', resize); resize();
const baseT = () => x.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);

const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eo = v => 1 - Math.pow(1 - cl(v), 3);
const eio = v => { v = cl(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };

// 字间距绘制（居中）
function spaced(text, cx, y, gap) {
  const ch = [...text], ws = ch.map(c => x.measureText(c).width);
  let p = cx - (ws.reduce((a, b) => a + b, 0) + gap * (ch.length - 1)) / 2;
  x.textAlign = 'left';
  ch.forEach((c, i) => { x.fillText(c, p, y); p += ws[i] + gap; });
}
function diamond(a, b, r, col) {
  x.fillStyle = col; x.beginPath();
  x.moveTo(a, b - r); x.lineTo(a + r * .6, b); x.lineTo(a, b + r); x.lineTo(a - r * .6, b);
  x.closePath(); x.fill();
}

/* ---------- 启动日志（进度条下方逐条显示） ---------- */
const LOG = [
  `Darwin Kernel ${INFO.darwin} / arm64 loaded`,
  `${INFO.chip} · ${INFO.mem} unified memory verified`,
  `Display pipeline online (${INFO.displays})`,
  `Loading core personality: ${INFO.ai}`,
  INFO.memories != null && `Memory bank restored: ${INFO.memories} entries`,
  INFO.reminders != null && `Reminder scheduler armed: ${INFO.reminders} routines`,
  INFO.claude && `Claude link established: ${INFO.claude}`,
  INFO.model && `Rendering body: ${INFO.model}`,
  `Host ${INFO.host} registered`,
  `Verifying operator: ${INFO.user}`,
].filter(Boolean);
/* ---------- 阶段 2：白金圣域 ---------- */
const GOLD = '201,164,92';

/* ---------- 阶段 1：密码栏处的进度条 ---------- */
// The password prompt of macOS 26 (measured, in points from the bottom): user picture 137.5 (45 pt across),
// password field 89 (160 × 28 pt), Touch ID line 59.5. The bar takes the field's place, the ring the picture's.
const LOCK_PT = { avatar: 137.5, avatarR: 22.5, field: 89, fieldW: 160, fieldH: 28, hint: 59.5, name: 209 };
const BAR_LOG = ['Operator verified', ...(RETURN ? LOG.slice(3, -2) : LOG.slice(0, -1)), RETURN ? 'Session restored' : 'All systems online'];
function ZH() { return /[一-鿿]/.test(INFO.greeting); }
// 进度：分三段推进，中间稍作停顿，看起来像真实的加载
function barProgress(t) {
  const k = cl(t / 1.45);
  return cl(.42 * eo(k / .35) + .33 * eo((k - .42) / .25) + .25 * eo((k - .74) / .26));
}
function bar(t) {
  baseT();
  const up = pt => VH - pt * U;
  const fy = up(LOCK_PT.field), fw = LOCK_PT.fieldW * U, fh = LOCK_PT.fieldH * U, ay = up(LOCK_PT.avatar), ar = LOCK_PT.avatarR * U;
  const p = barProgress(t), white = cl((t - 1.5) / .4);
  // Background: the screen saver's night, warming around the bar.
  x.fillStyle = '#030305'; x.fillRect(0, 0, VW, VH);
  const warm = x.createRadialGradient(CX, fy, 10, CX, fy, VW * .6);
  warm.addColorStop(0, `rgba(120,92,40,${.18 + .35 * p})`); warm.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = warm; x.fillRect(0, 0, VW, VH);
  const fade = eo(t / .25);

  // The ring where the user picture was: the inner disc fills with light as the bar runs.
  x.save(); x.globalAlpha = fade;
  const core = x.createRadialGradient(CX, ay, 0, CX, ay, ar);
  core.addColorStop(0, `rgba(255,240,205,${.25 + .6 * p})`); core.addColorStop(1, `rgba(214,186,130,${.08 + .2 * p})`);
  x.fillStyle = core; x.beginPath(); x.arc(CX, ay, ar, 0, 7); x.fill();
  x.strokeStyle = `rgba(${GOLD},.85)`; x.lineWidth = 1;
  x.beginPath(); x.arc(CX, ay, ar + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); x.stroke();
  x.strokeStyle = `rgba(${GOLD},.25)`; x.beginPath(); x.arc(CX, ay, ar + 10, 0, 7); x.stroke();
  for (let i = 0; i < 4; i++) {
    const a = t * 1.6 + i * Math.PI / 2;
    x.strokeStyle = `rgba(${GOLD},.8)`; x.lineWidth = 1.4;
    x.beginPath(); x.arc(CX, ay, ar + 10, a, a + .35); x.stroke();
  }
  diamond(CX, ay, 6 + 3 * p, `rgba(255,250,235,${.6 + .4 * p})`);

  // Name line: who was let in.
  x.font = `11px ${MONO}`; x.fillStyle = `rgba(${GOLD},.85)`; x.textBaseline = 'middle';
  spaced(ZH() ? `操作员已确认 · ${INFO.name}` : `OPERATOR VERIFIED · ${INFO.name.toUpperCase()}`, CX, up(LOCK_PT.name), 3);

  // The bar: a capsule as large as the password field, filled with a gold gradient and a passing sheen.
  const left = CX - fw / 2, top = fy - fh / 2, r = fh / 2;
  x.fillStyle = 'rgba(255,240,205,.06)'; x.beginPath(); x.roundRect(left, top, fw, fh, r); x.fill();
  x.strokeStyle = `rgba(${GOLD},.75)`; x.lineWidth = 1; x.beginPath(); x.roundRect(left, top, fw, fh, r); x.stroke();
  const inset = 3, iw = (fw - inset * 2) * p, ih = fh - inset * 2;
  if (iw > 1) {
    x.save(); x.beginPath(); x.roundRect(left + inset, top + inset, Math.max(iw, ih), ih, ih / 2); x.clip();
    const g = x.createLinearGradient(left, 0, left + fw, 0);
    g.addColorStop(0, '#7A5C24'); g.addColorStop(.45, '#C9A45C'); g.addColorStop(.8, '#F3DFA8'); g.addColorStop(1, '#FFF6DC');
    x.fillStyle = g; x.fillRect(left, top, fw, fh);
    const sx = left + ((t * 1.2) % 1.4 - .2) * fw;  // sheen
    const sg = x.createLinearGradient(sx - 30, 0, sx + 30, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.55)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = sg; x.fillRect(sx - 30, top, 60, fh);
    x.restore();
    // Spark at the head of the fill.
    const hx = left + inset + iw;
    const sp = x.createRadialGradient(hx, fy, 0, hx, fy, 16);
    sp.addColorStop(0, 'rgba(255,250,230,.95)'); sp.addColorStop(1, 'rgba(255,250,230,0)');
    x.fillStyle = sp; x.fillRect(hx - 16, fy - 16, 32, 32);
  }
  diamond(left - 12, fy, 5, `rgb(${GOLD})`); diamond(left + fw + 12, fy, 5, `rgb(${GOLD})`);
  // Hairlines on either side, as in the screen saver.
  [-1, 1].forEach(sgn => {
    const a = CX + sgn * (fw / 2 + 24), b = CX + sgn * (fw / 2 + 24 + 160 + 220 * p);
    const lg = x.createLinearGradient(a, 0, b, 0);
    lg.addColorStop(0, `rgba(${GOLD},.7)`); lg.addColorStop(1, `rgba(${GOLD},0)`);
    x.strokeStyle = lg; x.lineWidth = 1; x.beginPath(); x.moveTo(a, fy); x.lineTo(b, fy); x.stroke();
  });

  // Status line where the Touch ID hint was: the restore log, step by step, and the percentage.
  const step = BAR_LOG[Math.min(BAR_LOG.length - 1, Math.floor(p * (BAR_LOG.length - 1) + .0001))];
  x.font = `12px ${MONO}`; x.fillStyle = 'rgba(240,226,196,.8)';
  spaced(`${step}  ·  ${String(Math.round(p * 100)).padStart(3, ' ')}%`, CX, up(LOCK_PT.hint), 1);
  x.textBaseline = 'alphabetic';
  x.font = `11px ${MONO}`; x.textAlign = 'left'; x.fillStyle = `rgba(${GOLD},.75)`;
  x.fillText(`${INFO.aiLatin} CORE  //  ${RETURN ? (ZH() ? '恢复会话' : 'RESTORING SESSION') : (ZH() ? '启动核心' : 'BOOTING CORE')}`, 64, 64);
  x.restore();

  // At 100 %: light spreads from the bar over the screen, into the sanctum.
  if (white > 0) {
    const wg = x.createRadialGradient(CX, fy, 0, CX, fy, Math.max(VW, VH) * (.2 + 1.2 * eo(white)));
    wg.addColorStop(0, `rgba(255,252,244,${eo(white)})`); wg.addColorStop(.7, `rgba(255,252,244,${eo(white)})`); wg.addColorStop(1, 'rgba(255,252,244,0)');
    x.fillStyle = wg; x.fillRect(0, 0, VW, VH);
    if (white >= .95) { x.fillStyle = `rgba(255,252,244,${(white - .95) / .05})`; x.fillRect(0, 0, VW, VH); }
  }
}

const GREEK = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
const DUST = Array.from({ length: 110 }, () => ({
  u: Math.random(), v: Math.random(), s: 2 + Math.random() * 6, sp: 14 + Math.random() * 40, r: Math.random() * 6,
}));
function ring(r, p, o, w, a) {
  if (p <= 0) return;
  x.strokeStyle = `rgba(${GOLD},${a})`; x.lineWidth = w;
  x.beginPath(); x.arc(CX, CY, r, o, o + Math.PI * 2 * p); x.stroke();
}
function holy(s) {
  baseT();
  const R = Math.max(VW, VH) * .75;
  const bg = x.createRadialGradient(CX, CY, 30, CX, CY, R);
  bg.addColorStop(0, '#FFFEFA'); bg.addColorStop(1, '#EAE1CC');
  x.fillStyle = bg; x.fillRect(0, 0, VW, VH);

  // 光束
  const ra = eo(s / .7);
  x.save(); x.translate(CX, CY); x.rotate(s * .06);
  for (let i = 0; i < 24; i++) {
    x.rotate(Math.PI / 12);
    x.fillStyle = `rgba(214,180,110,${.055 * ra})`;
    x.beginPath(); x.moveTo(0, 0); x.lineTo(-24, -R); x.lineTo(24, -R); x.closePath(); x.fill();
  }
  x.restore();

  // 光环
  ring(165, eio((s - .10) / .7), -Math.PI / 2, 1.6, .95);
  ring(182, eio((s - .18) / .7), Math.PI / 2, .8, .6);
  ring(270, eio((s - .26) / .8), -Math.PI / 2 + s * .18, 1.1, .7);
  ring(330, eio((s - .36) / .9), Math.PI - s * .12, .7, .45);

  // 刻度环
  const tk = eo((s - .4) / .6);
  if (tk > 0) {
    x.save(); x.translate(CX, CY); x.rotate(s * .05);
    x.strokeStyle = `rgba(${GOLD},${.6 * tk})`; x.lineWidth = 1;
    for (let i = 0; i < 120 * tk; i++) {
      const a = i / 120 * Math.PI * 2, r2 = i % 10 ? 352 : 364;
      x.beginPath(); x.moveTo(Math.cos(a) * 344, Math.sin(a) * 344); x.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); x.stroke();
    }
    x.restore();
  }

  // 符文环
  const rp = eo((s - .45) / .6);
  if (rp > 0) {
    x.save(); x.translate(CX, CY); x.rotate(-s * .14);
    x.font = `13px "Times New Roman", serif`; x.textAlign = 'center';
    x.fillStyle = `rgba(122,92,36,${.75 * rp})`;
    for (let i = 0; i < 64; i++) {
      x.save(); x.rotate(i / 64 * Math.PI * 2);
      x.fillText(i % 2 ? GREEK[(i >> 1) % 24] : '·', 0, -222);
      x.restore();
    }
    x.restore();
  }

  // 六芒星
  const hp = eio((s - .5) / .7);
  if (hp > 0) {
    x.save(); x.translate(CX, CY); x.rotate(s * .09);
    x.strokeStyle = `rgba(${GOLD},${.55 * hp})`; x.lineWidth = 1;
    for (let k = 0; k < 2; k++) {
      x.beginPath();
      for (let i = 0; i <= 3; i++) {
        const a = -Math.PI / 2 + k * Math.PI + i * Math.PI * 2 / 3, r = 270 * hp;
        i ? x.lineTo(Math.cos(a) * r, Math.sin(a) * r) : x.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      x.stroke();
    }
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 - Math.PI / 2;
      diamond(Math.cos(a) * 270, Math.sin(a) * 270, 8 * hp, `rgb(${GOLD})`);
    }
    x.restore();
  }

  // 中心柔光
  const glow = x.createRadialGradient(CX, CY, 0, CX, CY, 200);
  glow.addColorStop(0, `rgba(255,255,255,${.8 * ra})`); glow.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = glow; x.fillRect(CX - 200, CY - 200, 400, 400);

  // 上浮碎片
  const da = .6 * eo(s / 1);
  DUST.forEach(d => {
    const y = ((d.v * VH - s * d.sp) % VH + VH) % VH;
    x.save(); x.translate(d.u * VW, y); x.rotate(d.r + s * .8); x.globalAlpha = da;
    diamond(0, 0, d.s, d.s > 6 ? '#FFFFFF' : '#D9BC7E');
    x.restore();
  });
  x.globalAlpha = 1;

  // 横幅与文字
  const bp = eio((s - .75) / .55), tp = eo((s - .85) / .6);
  if (bp > 0) {
    const bw = VW * bp, top = CY - 75, bot = CY + 75;
    x.fillStyle = `rgba(255,253,247,${.88 * bp})`; x.fillRect(CX - bw / 2, top, bw, 150);
    x.strokeStyle = `rgba(${GOLD},.85)`; x.lineWidth = 1;
    [top, bot].forEach(y => { x.beginPath(); x.moveTo(CX - bw / 2, y); x.lineTo(CX + bw / 2, y); x.stroke(); });
    diamond(CX - bw / 2 + 14, top, 5, `rgb(${GOLD})`); diamond(CX + bw / 2 - 14, bot, 5, `rgb(${GOLD})`);

    if (tp > 0) {
      const dy = (1 - tp) * 14;
      x.save(); x.globalAlpha = tp;
      x.font = `12px ${MONO}`; x.fillStyle = 'rgba(122,92,36,.8)';
      spaced('— OPERATOR AUTHORIZED · ALL SYSTEMS NOMINAL —', CX, top + 30, 5);
      const lg = x.createLinearGradient(CX - 520, 0, CX + 520, 0);
      lg.addColorStop(0, '#7A5C24'); lg.addColorStop(.5, '#B8914A'); lg.addColorStop(1, '#7A5C24');
      x.fillStyle = lg; x.font = `64px ${SERIF}`;
      spaced(`${INFO.aiLatin}  ·  ONLINE`, CX, CY + 20 + dy, 14);
      x.font = `300 16px ${CJK}`; x.fillStyle = 'rgba(122,92,36,.85)';
      spaced(`${INFO.greeting}  ·  ${INFO.os}`, CX, bot - 20, 3);
      x.restore();

      // 扫光
      const sh = (s - 1.5) / .6;
      if (sh > 0 && sh < 1) {
        const sx = CX - bw / 2 + sh * bw;
        x.save(); x.beginPath(); x.rect(CX - bw / 2, top + 1, bw, 148); x.clip();
        x.fillStyle = 'rgba(255,255,255,.7)';
        x.beginPath(); x.moveTo(sx, top); x.lineTo(sx + 60, top); x.lineTo(sx - 10, bot); x.lineTo(sx - 70, bot); x.fill();
        x.restore();
      }
    }
  }

  // 四角装饰与状态栏
  const op = eo((s - .6) / .5);
  if (op > 0) {
    x.strokeStyle = `rgba(${GOLD},${op})`; x.lineWidth = 1.2;
    [[40, 40, 1, 1], [VW - 40, 40, -1, 1], [40, VH - 40, 1, -1], [VW - 40, VH - 40, -1, -1]].forEach(([a, b, u, v]) => {
      x.beginPath(); x.moveTo(a, b + v * 80 * op); x.lineTo(a, b); x.lineTo(a + u * 80 * op, b); x.stroke();
      diamond(a + u * 18, b + v * 18, 4, `rgb(${GOLD})`);
    });
    x.font = `11px ${MONO}`; x.fillStyle = `rgba(122,92,36,${.75 * op})`;
    const now = new Date(), p2 = n => String(n).padStart(2, '0');
    x.textAlign = 'left';
    x.fillText(`${INFO.os.toUpperCase()}  //  ONLINE`, 64, 66);
    x.fillText(`${INFO.host.toUpperCase()}  //  LINK STABLE`, 64, VH - 56);
    x.textAlign = 'right';
    x.fillText(`${INFO.chip.toUpperCase()}  ·  ${INFO.mem}`, VW - 64, 66);
    x.fillText(`${now.getFullYear()}.${p2(now.getMonth() + 1)}.${p2(now.getDate())}  ${p2(now.getHours())}:${p2(now.getMinutes())}`, VW - 64, VH - 56);
  }

  // 入场白光
  const fl = 1 - cl(s / .35);
  if (fl > 0) { x.fillStyle = `rgba(255,252,244,${fl})`; x.fillRect(0, 0, VW, VH); }
}

/* ---------- 主循环 ---------- */
let t0 = performance.now(), sentDone = false, skipped = false;
function skip() { if (skipped) return; skipped = true; post('skip'); }
addEventListener('keydown', skip);
addEventListener('mousedown', skip);

function frame(now) {
  let t = (now - t0) / 1000;
  if (t >= T_DONE && !sentDone) { sentDone = true; post('done'); }
  if (t >= T_END) {
    if (!LOOP) { holy(T_HOLY); return; }
    t0 = now; t = 0; sentDone = false;
  }
  if (t < T1) bar(t);
  else holy(t - T1);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
