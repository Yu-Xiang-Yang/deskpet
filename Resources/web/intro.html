<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeskPet Intro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
// Login intro of DeskPet: terminal log → glitch → white-and-gold sanctum. The system information comes from
// the native shell as URL parameters; a browser preview uses neutral defaults.
const Q = new URLSearchParams(location.search);
const INFO = {
  name: Q.get('name') || 'Friend',
  os: Q.get('os') || 'macOS',
  host: Q.get('host') || 'Mac',
  chip: Q.get('chip') || 'Apple Silicon',
  mem: Q.get('mem') || '— GB',
  darwin: Q.get('darwin') || '—',
  displays: Q.get('displays') || '1',
  user: Q.get('user') || 'user',
  greeting: Q.get('greeting') || 'Welcome back',
  ai: Q.get('ai') || 'DeskPet',              // the pet's name as shown
  aiLatin: Q.get('aiLatin') || 'DESKPET',    // the same in Latin capitals, for the large title
  memories: Q.get('memories'),               // optional live details for the boot log
  reminders: Q.get('reminders'),
  claude: Q.get('claude'),
  model: Q.get('model'),
};
const LOOP = Q.has('loop');
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.boot;
const post = m => { if (native) native.postMessage(m); };

// 时间轴（秒）
const T_TERM = 1.7, T_GLITCH = 0.6, T_HOLY = 3.9;
const T1 = T_TERM, T2 = T_TERM + T_GLITCH, T_END = T2 + T_HOLY;
const T_DONE = T_END - 0.6; // 通知播放器开始 0.6 s 淡出

const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
const SERIF = 'Didot, "Bodoni 72", "Times New Roman", serif';
const CJK = '"PingFang SC", "Hiragino Sans GB", sans-serif';

const cv = document.getElementById('cv'), x = cv.getContext('2d');
// 虚拟坐标系：高度固定 900，宽度随屏幕比例变化
let VW, VH = 900, CX, CY, S, DPR;
function resize() {
  const w = innerWidth, h = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 3840 / w);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  S = h / VH; VW = w / S; CX = VW / 2; CY = VH / 2;
}
addEventListener('resize', resize); resize();
const baseT = () => x.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);

const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eo = v => 1 - Math.pow(1 - cl(v), 3);
const eio = v => { v = cl(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };

// 字间距绘制（居中）
function spaced(text, cx, y, gap) {
  const ch = [...text], ws = ch.map(c => x.measureText(c).width);
  let p = cx - (ws.reduce((a, b) => a + b, 0) + gap * (ch.length - 1)) / 2;
  x.textAlign = 'left';
  ch.forEach((c, i) => { x.fillText(c, p, y); p += ws[i] + gap; });
}
function diamond(a, b, r, col) {
  x.fillStyle = col; x.beginPath();
  x.moveTo(a, b - r); x.lineTo(a + r * .6, b); x.lineTo(a, b + r); x.lineTo(a - r * .6, b);
  x.closePath(); x.fill();
}

// 预生成噪点与扫描线
const NOISE = Array.from({ length: 4 }, () => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = Math.random() * 255 | 0;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0); return c;
});
const scan = (() => {
  const c = document.createElement('canvas'); c.width = 1; c.height = 4;
  const g = c.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, 1, 2);
  return x.createPattern(c, 'repeat');
})();

/* ---------- 阶段 1：终端日志 ---------- */
const LOG = [
  `Darwin Kernel ${INFO.darwin} / arm64 loaded`,
  `${INFO.chip} · ${INFO.mem} unified memory verified`,
  `Display pipeline online (${INFO.displays})`,
  `Loading core personality: ${INFO.ai}`,
  INFO.memories != null && `Memory bank restored: ${INFO.memories} entries`,
  INFO.reminders != null && `Reminder scheduler armed: ${INFO.reminders} routines`,
  INFO.claude && `Claude link established: ${INFO.claude}`,
  INFO.model && `Rendering body: ${INFO.model}`,
  `Host ${INFO.host} registered`,
  `Verifying operator: ${INFO.user}`,
].filter(Boolean);
const hex = n => (n >>> 0).toString(16).toUpperCase().padStart(4, '0').slice(-4);
function term(t) {
  baseT();
  x.fillStyle = '#000'; x.fillRect(0, 0, VW, VH);
  x.font = `13px ${MONO}`; x.fillStyle = '#1F7A3A'; x.textAlign = 'left';
  x.fillText(`${INFO.aiLatin} CORE  //  ${INFO.os} — secure boot`, 60, 44);
  // 右侧十六进制流
  x.fillStyle = 'rgba(47,191,90,.22)';
  const seed = Math.floor(t * 20);
  for (let i = 0; i < 30; i++) {
    let row = '';
    for (let j = 0; j < 8; j++) row += hex((i * 131 + j * 977 + seed * 7919) * 2654435761) + ' ';
    x.fillText(row, VW - 420, 80 + i * 26);
  }
  x.font = `16px ${MONO}`;
  const n = Math.min(LOG.length, Math.floor(t / 0.11) + 1);
  for (let i = 0; i < n; i++) {
    x.fillStyle = i === n - 1 ? '#8CFFAA' : '#2FBF5A';
    x.fillText('[ OK ] ' + LOG[i], 60, 90 + i * 30);
    x.fillStyle = '#1F7A3A';
    x.fillText('0x' + hex(i * 7919 + 4096), 640, 90 + i * 30);
  }
  const yWarn = 90 + LOG.length * 30 + 12;
  x.fillStyle = '#FF4D6D';
  if (t > 1.15) x.fillText('[ !! ] Core personality awakening', 60, yWarn);
  if (t > 1.3) x.fillText(`[ !! ] Synchronizing ${INFO.aiLatin} ... ${Math.floor(cl((t - 1.3) / .35) * 100)}%`, 60, yWarn + 30);
  if (Math.floor(t * 6) % 2) { x.fillStyle = '#8CFFAA'; x.fillRect(60, yWarn + 46, 10, 18); }
}

/* ---------- 阶段 2：故障转场 ---------- */
function glitch(t) {
  const k = t / T_GLITCH;
  term(T_TERM - 0.01);
  // 横向撕裂：在设备像素坐标下复制条带
  x.setTransform(1, 0, 0, 1, 0, 0);
  const W = cv.width, H = cv.height;
  for (let i = 0; i < 4 + k * 16; i++) {
    const y = Math.random() * H, h = (4 + Math.random() * 40) * DPR * S;
    x.drawImage(cv, 0, y, W, h, (Math.random() - .5) * 220 * k * DPR * S, y, W, h);
  }
  baseT();
  x.globalAlpha = .25 + .6 * k;
  for (let yy = 0; yy < VH; yy += 256) for (let xx = 0; xx < VW; xx += 256)
    x.drawImage(NOISE[Math.random() * 4 | 0], xx, yy);
  x.globalAlpha = 1;
  x.font = `bold 96px "Helvetica Neue", Helvetica, Arial`; x.textAlign = 'center';
  const s = (Math.random() - .5) * 24, AW = 'CORE AWAKENING';
  x.globalCompositeOperation = 'lighter';
  x.fillStyle = '#ff2a6d'; x.fillText(AW, CX - 7 + s, CY + 30);
  x.fillStyle = '#05d9e8'; x.fillText(AW, CX + 7 - s, CY + 36);
  x.fillStyle = '#e8fbff'; x.fillText(AW, CX, CY + 33);
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = scan; x.fillRect(0, 0, VW, VH);
  if (k > .7) { x.fillStyle = `rgba(255,252,244,${cl((k - .7) / .3)})`; x.fillRect(0, 0, VW, VH); }
}

/* ---------- 阶段 3：白金圣域 ---------- */
const GOLD = '201,164,92';
const GREEK = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
const DUST = Array.from({ length: 110 }, () => ({
  u: Math.random(), v: Math.random(), s: 2 + Math.random() * 6, sp: 14 + Math.random() * 40, r: Math.random() * 6,
}));
function ring(r, p, o, w, a) {
  if (p <= 0) return;
  x.strokeStyle = `rgba(${GOLD},${a})`; x.lineWidth = w;
  x.beginPath(); x.arc(CX, CY, r, o, o + Math.PI * 2 * p); x.stroke();
}
function holy(s) {
  baseT();
  const R = Math.max(VW, VH) * .75;
  const bg = x.createRadialGradient(CX, CY, 30, CX, CY, R);
  bg.addColorStop(0, '#FFFEFA'); bg.addColorStop(1, '#EAE1CC');
  x.fillStyle = bg; x.fillRect(0, 0, VW, VH);

  // 光束
  const ra = eo(s / .7);
  x.save(); x.translate(CX, CY); x.rotate(s * .06);
  for (let i = 0; i < 24; i++) {
    x.rotate(Math.PI / 12);
    x.fillStyle = `rgba(214,180,110,${.055 * ra})`;
    x.beginPath(); x.moveTo(0, 0); x.lineTo(-24, -R); x.lineTo(24, -R); x.closePath(); x.fill();
  }
  x.restore();

  // 光环
  ring(165, eio((s - .10) / .7), -Math.PI / 2, 1.6, .95);
  ring(182, eio((s - .18) / .7), Math.PI / 2, .8, .6);
  ring(270, eio((s - .26) / .8), -Math.PI / 2 + s * .18, 1.1, .7);
  ring(330, eio((s - .36) / .9), Math.PI - s * .12, .7, .45);

  // 刻度环
  const tk = eo((s - .4) / .6);
  if (tk > 0) {
    x.save(); x.translate(CX, CY); x.rotate(s * .05);
    x.strokeStyle = `rgba(${GOLD},${.6 * tk})`; x.lineWidth = 1;
    for (let i = 0; i < 120 * tk; i++) {
      const a = i / 120 * Math.PI * 2, r2 = i % 10 ? 352 : 364;
      x.beginPath(); x.moveTo(Math.cos(a) * 344, Math.sin(a) * 344); x.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); x.stroke();
    }
    x.restore();
  }

  // 符文环
  const rp = eo((s - .45) / .6);
  if (rp > 0) {
    x.save(); x.translate(CX, CY); x.rotate(-s * .14);
    x.font = `13px "Times New Roman", serif`; x.textAlign = 'center';
    x.fillStyle = `rgba(122,92,36,${.75 * rp})`;
    for (let i = 0; i < 64; i++) {
      x.save(); x.rotate(i / 64 * Math.PI * 2);
      x.fillText(i % 2 ? GREEK[(i >> 1) % 24] : '·', 0, -222);
      x.restore();
    }
    x.restore();
  }

  // 六芒星
  const hp = eio((s - .5) / .7);
  if (hp > 0) {
    x.save(); x.translate(CX, CY); x.rotate(s * .09);
    x.strokeStyle = `rgba(${GOLD},${.55 * hp})`; x.lineWidth = 1;
    for (let k = 0; k < 2; k++) {
      x.beginPath();
      for (let i = 0; i <= 3; i++) {
        const a = -Math.PI / 2 + k * Math.PI + i * Math.PI * 2 / 3, r = 270 * hp;
        i ? x.lineTo(Math.cos(a) * r, Math.sin(a) * r) : x.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      x.stroke();
    }
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 - Math.PI / 2;
      diamond(Math.cos(a) * 270, Math.sin(a) * 270, 8 * hp, `rgb(${GOLD})`);
    }
    x.restore();
  }

  // 中心柔光
  const glow = x.createRadialGradient(CX, CY, 0, CX, CY, 200);
  glow.addColorStop(0, `rgba(255,255,255,${.8 * ra})`); glow.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = glow; x.fillRect(CX - 200, CY - 200, 400, 400);

  // 上浮碎片
  const da = .6 * eo(s / 1);
  DUST.forEach(d => {
    const y = ((d.v * VH - s * d.sp) % VH + VH) % VH;
    x.save(); x.translate(d.u * VW, y); x.rotate(d.r + s * .8); x.globalAlpha = da;
    diamond(0, 0, d.s, d.s > 6 ? '#FFFFFF' : '#D9BC7E');
    x.restore();
  });
  x.globalAlpha = 1;

  // 横幅与文字
  const bp = eio((s - .75) / .55), tp = eo((s - .85) / .6);
  if (bp > 0) {
    const bw = VW * bp, top = CY - 75, bot = CY + 75;
    x.fillStyle = `rgba(255,253,247,${.88 * bp})`; x.fillRect(CX - bw / 2, top, bw, 150);
    x.strokeStyle = `rgba(${GOLD},.85)`; x.lineWidth = 1;
    [top, bot].forEach(y => { x.beginPath(); x.moveTo(CX - bw / 2, y); x.lineTo(CX + bw / 2, y); x.stroke(); });
    diamond(CX - bw / 2 + 14, top, 5, `rgb(${GOLD})`); diamond(CX + bw / 2 - 14, bot, 5, `rgb(${GOLD})`);

    if (tp > 0) {
      const dy = (1 - tp) * 14;
      x.save(); x.globalAlpha = tp;
      x.font = `12px ${MONO}`; x.fillStyle = 'rgba(122,92,36,.8)';
      spaced('— OPERATOR AUTHORIZED · ALL SYSTEMS NOMINAL —', CX, top + 30, 5);
      const lg = x.createLinearGradient(CX - 520, 0, CX + 520, 0);
      lg.addColorStop(0, '#7A5C24'); lg.addColorStop(.5, '#B8914A'); lg.addColorStop(1, '#7A5C24');
      x.fillStyle = lg; x.font = `64px ${SERIF}`;
      spaced(`${INFO.aiLatin}  ·  ONLINE`, CX, CY + 20 + dy, 14);
      x.font = `300 16px ${CJK}`; x.fillStyle = 'rgba(122,92,36,.85)';
      spaced(`${INFO.greeting}  ·  ${INFO.os}`, CX, bot - 20, 3);
      x.restore();

      // 扫光
      const sh = (s - 1.5) / .6;
      if (sh > 0 && sh < 1) {
        const sx = CX - bw / 2 + sh * bw;
        x.save(); x.beginPath(); x.rect(CX - bw / 2, top + 1, bw, 148); x.clip();
        x.fillStyle = 'rgba(255,255,255,.7)';
        x.beginPath(); x.moveTo(sx, top); x.lineTo(sx + 60, top); x.lineTo(sx - 10, bot); x.lineTo(sx - 70, bot); x.fill();
        x.restore();
      }
    }
  }

  // 四角装饰与状态栏
  const op = eo((s - .6) / .5);
  if (op > 0) {
    x.strokeStyle = `rgba(${GOLD},${op})`; x.lineWidth = 1.2;
    [[40, 40, 1, 1], [VW - 40, 40, -1, 1], [40, VH - 40, 1, -1], [VW - 40, VH - 40, -1, -1]].forEach(([a, b, u, v]) => {
      x.beginPath(); x.moveTo(a, b + v * 80 * op); x.lineTo(a, b); x.lineTo(a + u * 80 * op, b); x.stroke();
      diamond(a + u * 18, b + v * 18, 4, `rgb(${GOLD})`);
    });
    x.font = `11px ${MONO}`; x.fillStyle = `rgba(122,92,36,${.75 * op})`;
    const now = new Date(), p2 = n => String(n).padStart(2, '0');
    x.textAlign = 'left';
    x.fillText(`${INFO.os.toUpperCase()}  //  ONLINE`, 64, 66);
    x.fillText(`${INFO.host.toUpperCase()}  //  LINK STABLE`, 64, VH - 56);
    x.textAlign = 'right';
    x.fillText(`${INFO.chip.toUpperCase()}  ·  ${INFO.mem}`, VW - 64, 66);
    x.fillText(`${now.getFullYear()}.${p2(now.getMonth() + 1)}.${p2(now.getDate())}  ${p2(now.getHours())}:${p2(now.getMinutes())}`, VW - 64, VH - 56);
  }

  // 入场白光
  const fl = 1 - cl(s / .35);
  if (fl > 0) { x.fillStyle = `rgba(255,252,244,${fl})`; x.fillRect(0, 0, VW, VH); }
}

/* ---------- 主循环 ---------- */
let t0 = performance.now(), sentDone = false, skipped = false;
function skip() { if (skipped) return; skipped = true; post('skip'); }
addEventListener('keydown', skip);
addEventListener('mousedown', skip);

function frame(now) {
  let t = (now - t0) / 1000;
  if (t >= T_DONE && !sentDone) { sentDone = true; post('done'); }
  if (t >= T_END) {
    if (!LOOP) { holy(T_HOLY); return; }
    t0 = now; t = 0; sentDone = false;
  }
  if (t < T1) term(t);
  else if (t < T2) glitch(t - T1);
  else holy(t - T2);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
